<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="72" height="72" rx="12" fill="url(#grad1)"/>

  <!-- Book/Language Symbol -->
  <g transform="translate(16, 18)">
    <!-- Open Book -->
    <path d="M 0 8 Q 0 4 4 4 L 16 4 Q 20 4 20 8 L 20 32 Q 20 36 16 36 L 4 36 Q 0 36 0 32 Z"
          fill="#ffffff" opacity="0.9"/>
    <path d="M 20 8 Q 20 4 24 4 L 36 4 Q 40 4 40 8 L 40 32 Q 40 36 36 36 L 24 36 Q 20 36 20 32 Z"
          fill="#ffffff" opacity="0.9"/>

    <!-- Book spine/center -->
    <line x1="20" y1="8" x2="20" y2="36" stroke="#357abd" stroke-width="1.5"/>

    <!-- Letter A -->
    <text x="10" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
          fill="#4a90e2" text-anchor="middle">A</text>

    <!-- Letter あ (Hiragana) -->
    <text x="30" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
          fill="#4a90e2" text-anchor="middle">あ</text>
  </g>
</svg>
