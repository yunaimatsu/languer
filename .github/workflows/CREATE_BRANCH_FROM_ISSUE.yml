name: Create Branch from Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to create branch from'
        required: true
        type: string
      branch_type:
        description: 'Branch type (feature/bugfix/hotfix)'
        required: true
        type: string
        default: 'feature'
      base_branch:
        description: 'Base branch to create from'
        required: false
        type: string
        default: 'main'

jobs:
  create-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          token: ${{ secrets.PAT_LANGUER }}

      - name: Validate inputs
        run: |
          VALID_TYPES=("feature" "bugfix" "hotfix")
          BRANCH_TYPE="${{ inputs.branch_type }}"

          if [[ ! " ${VALID_TYPES[@]} " =~ " ${BRANCH_TYPE} " ]]; then
            echo "Error: Invalid branch_type '${BRANCH_TYPE}'. Must be one of: feature, bugfix, hotfix"
            exit 1
          fi

          if ! [[ "${{ inputs.issue_number }}" =~ ^[0-9]+$ ]]; then
            echo "Error: Invalid issue_number. Must be a positive integer"
            exit 1
          fi

      - name: Get issue details
        id: issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }}
            });
            const issueNumber = String(${{ inputs.issue_number }}).padStart(4, '0');
            const branchName = `${{ inputs.branch_type }}/#${issueNumber}/${issue.data.title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '_')
              .replace(/^_|_$/g, '')
              .substring(0, 50)}`;
            core.setOutput('branch_name', branchName);
            core.setOutput('issue_title', issue.data.title);
            core.setOutput('issue_url', issue.data.html_url);
            return branchName;

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push branch
        id: create_branch
        run: |
          BRANCH_NAME="${{ steps.issue.outputs.branch_name }}"

          # ブランチを作成
          git checkout -b "$BRANCH_NAME"

          # 空のコミットを作成（ブランチの起点として）
          git commit --allow-empty -m "CREATE: Branch for issue #${{ inputs.issue_number }}

          Issue: ${{ steps.issue.outputs.issue_title }}
          URL: ${{ steps.issue.outputs.issue_url }}
          Type: ${{ inputs.branch_type }}
          Base: ${{ inputs.base_branch }}"

          # リモートにプッシュ
          git push origin "$BRANCH_NAME"

          echo "branch_created=true" >> $GITHUB_OUTPUT

      - name: Comment on issue
        if: steps.create_branch.outputs.branch_created == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
              body: `## ✅ Branch Created

**Branch Name:** \`${{ steps.issue.outputs.branch_name }}\`
**Base Branch:** \`${{ inputs.base_branch }}\`
**Type:** \`${{ inputs.branch_type }}\`

### To start working on this issue:

\`\`\`bash
git fetch origin
git checkout ${{ steps.issue.outputs.branch_name }}
\`\`\`

Or:

\`\`\`bash
git pull
git checkout ${{ steps.issue.outputs.branch_name }}
\`\`\`

---
🤖 Branch created automatically by GitHub Actions`
            });
