<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Language learning tool for vocabulary and conjugation practice" />
  <meta name="theme-color" content="#4a90e2" />
  <title>Languer</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- iOS meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Languer" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon-72x72.svg" />

  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <select id="mode-select">
    <option value="typing">Vocabulary</option>
    <option value="conjugation">Conjugation</option>
  </select>
  <button id="start-btn">▶ Start</button>
    <!-- Typing Mode -->
    <div id="typing-section" class="mode-section">
      <div id="status">
        <span id="timer">⏱ 0.00s</span>
        <span id="progress">📊 0 / 10</span>
        <span id="wpm">💨 0 WPM</span>
      </div>
      <div id="text-display">Press Start to begin!</div>
      <input type="text" id="input" autocomplete="off" disabled placeholder="Type the word above..." />
      <p id="result"></p>
    </div>

    <!-- Conjugation Mode -->
    <div id="conj-section" class="mode-section">
      <h2 id="conj-verb">Select a verb to conjugate</h2>
      <h3 id="conj-tense"></h3>
      <form id="conj-form">
        <!-- Dynamic table will be inserted here -->
      </form>
      <p id="conj-result"></p>
    </div>
  </div>
</body>
</html>
